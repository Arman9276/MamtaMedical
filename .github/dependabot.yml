version: 2
updates:
  # Keep GitHub Actions versions current and patched across all workflows
  # (checkout, build-push, login, trivy-action, scan-action, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Watch the base image in the Dockerfile (e.g. a new nginx-unprivileged line).
  # Note: this tracks tag changes (1.30 -> 1.32), not digest rebuilds of the
  # same tag — patch-level base updates still come via your rebuild routine.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"