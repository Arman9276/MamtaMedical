name: "CodeQL Security Scan"

on:
  workflow_call:
    inputs:
      languages:
        description: "Languages to scan (comma-separated)"
        type: string
        default: "javascript"      # Falls back to javascript if not provided

jobs:
  analyze:
    name: Analyze JavaScript Code
    runs-on: ubuntu-latest
    # No permissions block here — this reusable workflow inherits whatever
    # the caller (security-scan.yml) grants: security-events / actions / contents.

    steps:
      # Step A: Download your codebase to the runner
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      # Step B: Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.languages }}
          build-mode: 'none'     # Skips compilation (ideal for JavaScript/TypeScript)

      # Step C: Scan the code AND upload findings to the Security tab (auto-upload)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
