name: "Semgrep SAST"

# Reusable workflow — called by security-scan.yml via `uses:`.
on:
  workflow_call:
    inputs:
      fail_on_findings:
        description: "If true, fail the job when Semgrep finds issues. If false, just report."
        type: boolean
        default: false

jobs:
  semgrep:
    name: Scan code with Semgrep
    runs-on: ubuntu-latest
    # No permissions block here — inherits what the caller grants
    # (needs: contents: read + security-events: write for the SARIF upload).

    steps:
      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Set up Python (Semgrep is a Python tool)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 3. Cache pip downloads so Semgrep isn't re-downloaded every run
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-semgrep-${{ hashFiles('.github/workflows/semgrep.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-semgrep-

      # 4. Install Semgrep
      - name: Install Semgrep
        run: pip install semgrep

      # 5. Run the scan with three rule packs:
      #    p/security-audit (general), p/javascript (your code), p/secrets (keys)
      - name: Run Semgrep scan
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/javascript \
            --config p/secrets \
            --sarif --output semgrep.sarif
          code=$?
          echo "Semgrep finished with exit code: $code"
          if [ "${{ inputs.fail_on_findings }}" = "true" ]; then
            exit $code
          fi
          exit 0

      # 6. Publish findings to the Security tab (Code scanning)
      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif