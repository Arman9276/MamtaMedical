name: Artifact Upload Demo

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Generate test report
        run: |
          mkdir -p reports
          cat > reports/test-report.txt << 'EOF'
          =============================
          Test Report
          =============================
          Date:   $(date)
          Commit: $GITHUB_SHA
          Runner: $RUNNER_OS

          Results:
            PASS  login_flow
            PASS  signup_flow
            FAIL  payment_flow (timeout after 30s)
            PASS  logout_flow

          Summary: 3 passed, 1 failed
          EOF

          # Also generate a simple JSON report
          cat > reports/summary.json << 'EOF'
          {
            "total": 4,
            "passed": 3,
            "failed": 1,
            "failures": ["payment_flow"]
          }
          EOF

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
          retention-days: 14
