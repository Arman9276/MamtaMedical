name: "Betterleaks Secrets Scan"

# Reusable workflow — called by security-scan.yml via `uses:`.
on:
  workflow_call:
    inputs:
      ignore-path:
        description: 'Path to the .gitleaksignore / .betterleaksignore file'
        required: false
        type: string
        default: '.gitleaksignore'

jobs:
  betterleaks-scan:
    name: Secrets Detection Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # to upload the SARIF report to the Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so every commit is scanned

      - name: Run Betterleaks
        # NOTE: third-party action. For production, pin to a full commit SHA
        # instead of a tag (e.g. dortort/betterleaks-action@<sha>).
        uses: dortort/betterleaks-action@v0.1.0
        with:
          version: 'latest'
          scan-mode: 'git'        # scan the git history
          scan-path: '.'
          report-format: 'sarif'
          report-path: 'betterleaks-report.sarif'
          redact: 'true'          # never print secret values in the logs
          validation: 'false'     # do NOT send findings to external vendor APIs
          no-banner: 'true'
          fail-on-leak: 'true'    # fail the job if a leak is found
          extra-args: '--gitleaks-ignore-path ${{ inputs.ignore-path }}'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: betterleaks-report.sarif