name: Docker Build and Push

on:
    workflow_call:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read        # read repository code (checkout)
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Verify Docker username is set
              # Fail fast with a clear message instead of the cryptic
              # "invalid tag /mamta-medical:..." error you get when the
              # variable is empty (i.e. saved as a Secret, not a Variable).
              run: |
                if [ -z "${{ vars.DOCKER_USERNAME }}" ]; then
                  echo "::error::DOCKER_USERNAME is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables tab (NOT Secrets)."
                  exit 1
                fi
                echo "DOCKER_USERNAME is set."

            - name: Login to Docker Hub
              uses: docker/login-action@v4.1.0
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push to Docker Hub
              uses: docker/build-push-action@v7
              with:
                context: .
                file: dockerfile                                    # lowercase, matches the actual file
                push: true
                tags: |
                  ${{ vars.DOCKER_USERNAME }}/mamta-medical:v1.4.1   # matches the tag docker-compose pulls