name: Docker Build and Push

on:
    workflow_call:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        # read repository code (checkout)
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            # Fail fast with a clear message instead of the cryptic
            # "invalid tag /mamta-medical:..." error you get when the
            # variable is empty (e.g. saved as a Secret, not a Variable).
            - name: Verify Docker username is set
              run: |
                if [ -z "${{ vars.DOCKER_USERNAME }}" ]; then
                  echo "::error::DOCKER_USERNAME is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables tab (NOT Secrets)."
                  exit 1
                fi
                echo "DOCKER_USERNAME is set."

            - name: Login to Docker Hub
              uses: docker/login-action@v4.1.0
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            # NOTE: no comments allowed inside the "tags:" block below.
            # In a YAML block scalar (|) the '#' is literal text, not a
            # comment, so it would become part of the tag and break the build.
            # Pushes two tags: :latest and :v1.4.1 (the tag docker-compose pulls).
            - name: Build and Push to Docker Hub
              uses: docker/build-push-action@v7
              with:
                context: .
                file: dockerfile
                push: true
                tags: |
                  ${{ vars.DOCKER_USERNAME }}/mamta-medical:latest
                  ${{ vars.DOCKER_USERNAME }}/mamta-medical:v1.4.1