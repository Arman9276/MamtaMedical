name: Docker Build and Push

on:
    workflow_call:
        inputs:
            version:
                description: "Image version tag (e.g. v1.4.2)"
                required: true
                type: string

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Resolve image tag
              id: meta
              run: |
                user="$(printf '%s' '${{ vars.DOCKER_USERNAME }}' | tr -d '[:space:]')"
                ver="$(printf '%s' '${{ inputs.version }}' | tr -d '[:space:]')"
                if [ -z "$user" ]; then
                  echo "::error::DOCKER_USERNAME is empty. Set it on Settings -> Secrets and variables -> Actions -> Variables tab."
                  exit 1
                fi
                if [ -z "$ver" ]; then
                  echo "::error::version input is empty."
                  exit 1
                fi
                tag="${user}/mamta-medical:${ver}"
                echo "username=${user}" >> "$GITHUB_OUTPUT"
                echo "tag=${tag}"        >> "$GITHUB_OUTPUT"
                echo "Building and pushing: ${tag}"

            - name: Login to Docker Hub
              uses: docker/login-action@v4.2.0
              with:
                username: ${{ steps.meta.outputs.username }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push to Docker Hub
              uses: docker/build-push-action@v7
              with:
                context: .
                file: Dockerfile
                push: true
                tags: ${{ steps.meta.outputs.tag }}