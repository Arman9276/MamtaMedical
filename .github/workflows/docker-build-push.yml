name: Docker Build and Push

on:
    workflow_call:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            # The DOCKER_USERNAME variable can carry a stray trailing newline
            # (easy to paste in by accident). That newline makes the tag parser
            # split "user/image" into two broken tags. Strip ALL whitespace here
            # and build the tag list from the cleaned value, so it can't break.
            - name: Resolve image tags
              id: meta
              run: |
                user="$(printf '%s' '${{ vars.DOCKER_USERNAME }}' | tr -d '[:space:]')"
                if [ -z "$user" ]; then
                  echo "::error::DOCKER_USERNAME is empty after trimming. Set it on Settings -> Secrets and variables -> Actions -> Variables tab."
                  exit 1
                fi
                tags="${user}/mamta-medical:latest,${user}/mamta-medical:v1.4.1"
                echo "username=${user}" >> "$GITHUB_OUTPUT"
                echo "tags=${tags}"      >> "$GITHUB_OUTPUT"
                echo "Cleaned username: [${user}]"
                echo "Resolved tags:    ${tags}"

            - name: Login to Docker Hub
              uses: docker/login-action@v4.1.0
              with:
                username: ${{ steps.meta.outputs.username }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push to Docker Hub
              uses: docker/build-push-action@v7
              with:
                context: .
                file: dockerfile
                push: true
                tags: ${{ steps.meta.outputs.tags }}
