name: Docker Lint

on:
    workflow_call:      # lets the security-scan orchestrator call this with `uses:`
    workflow_dispatch:  # still runnable on its own from the Actions tab

jobs:
    validate-dockerfile:
        runs-on: ubuntu-latest
        permissions:
            contents: read        # read repository code
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Validate Dockerfile
              uses: hadolint/hadolint-action@v3.3.0
              with:
                dockerfile: Dockerfile   # lowercase, matches the actual file name
                # failure-threshold: error  # uncomment to let warnings pass and only fail on errors
