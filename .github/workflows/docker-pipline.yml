name: "Docker pipeline"

# Full Docker image lifecycle: docker-lint -> build & push -> Trivy image scan.
# The version tag is set ONCE here and passed to both build/push and scan,
# so they always agree. No more :latest — only the immutable version tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to build, push and scan (e.g. v1.4.3)"
        required: true
        default: "v1.4.3"
        type: string

jobs:
  docker-lint:
    name: Docker Lint
    uses: ./.github/workflows/docker-lint.yml
    permissions:
      contents: read

  docker-build-push:
    needs: docker-lint
    name: Build & Push Docker Image
    uses: ./.github/workflows/docker-build-push.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: read

  image-scan:
    needs: docker-build-push
    name: Image Scan
    uses: ./.github/workflows/image-scan.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: read

  grype-scan:
    needs: docker-build-push
    name: Grype Scan
    uses: ./.github/workflows/grype-scan.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: read