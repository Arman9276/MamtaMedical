# Scans the pushed image with Grype (Anchore) — a second opinion alongside Trivy.
name: Grype Scanner

on:
  workflow_call:
    inputs:
      version:
        description: "Image version tag to scan (e.g. v1.4.2)"
        required: true
        type: string

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Resolve image reference
        id: meta
        run: |
          user="$(printf '%s' '${{ vars.DOCKER_USERNAME }}' | tr -d '[:space:]')"
          ver="$(printf '%s' '${{ inputs.version }}' | tr -d '[:space:]')"
          if [ -z "$user" ]; then echo "::error::DOCKER_USERNAME is empty (Variables tab)."; exit 1; fi
          if [ -z "$ver" ]; then echo "::error::version input is empty."; exit 1; fi
          image="${user}/mamta-medical:${ver}"
          echo "username=${user}" >> "$GITHUB_OUTPUT"
          echo "image=${image}"    >> "$GITHUB_OUTPUT"
          echo "Image to scan: ${image}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ steps.meta.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull the image into the local daemon
        # Pull (authenticated) so Grype reads the image from the local daemon.
        # The login above keeps this working whether the repo is public or private.
        run: docker pull ${{ steps.meta.outputs.image }}

      - name: Scan image with Grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.meta.outputs.image }}
          severity-cutoff: high     # fail on HIGH and CRITICAL (matches the Trivy gate)
          only-fixed: true          # ignore CVEs with no available fix (= Trivy ignore-unfixed)
          fail-build: true          # fail the job when the cutoff is reached
          output-format: table      # print the findings in the run log