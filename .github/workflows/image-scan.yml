# Uses Trivy image scanner for Common Vulnerabilities and Exposures (CVEs) in the built Docker image
name: Image Scanner

on:
  workflow_call: # Enables this workflow to be called as a reusable template

jobs:
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # read repository code
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      # Strip any stray whitespace/newline from DOCKER_USERNAME before building
      # the image reference, so a polluted variable can't produce an invalid ref.
      - name: Resolve image reference
        id: meta
        run: |
          user="$(printf '%s' '${{ vars.DOCKER_USERNAME }}' | tr -d '[:space:]')"
          if [ -z "$user" ]; then
            echo "::error::DOCKER_USERNAME is empty after trimming. Set it on the Variables tab."
            exit 1
          fi
          image="${user}/mamta-medical:latest"
          echo "username=${user}"  >> "$GITHUB_OUTPUT"
          echo "image=${image}"     >> "$GITHUB_OUTPUT"
          echo "Image to scan: ${image}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ steps.meta.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.70.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          exit-code: '1'              # fail the job on findings at/above the severity below
          ignore-unfixed: true        # skip CVEs with no fix available (nothing we can do)
          format: 'table'
          severity: 'HIGH,CRITICAL'
