# Uses Trivy image scanner for Common Vulnerabilities and Exposures (CVEs) in the built Docker image
name: Image Scanner

on:
  workflow_call:
    inputs:
      version:
        description: "Image version tag to scan (e.g. v1.4.2)"
        required: true
        type: string

jobs:
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Resolve image reference
        id: meta
        run: |
          user="$(printf '%s' '${{ vars.DOCKER_USERNAME }}' | tr -d '[:space:]')"
          ver="$(printf '%s' '${{ inputs.version }}' | tr -d '[:space:]')"
          if [ -z "$user" ]; then echo "::error::DOCKER_USERNAME is empty (Variables tab)."; exit 1; fi
          if [ -z "$ver" ]; then echo "::error::version input is empty."; exit 1; fi
          image="${user}/mamta-medical:${ver}"
          echo "username=${user}" >> "$GITHUB_OUTPUT"
          echo "image=${image}"    >> "$GITHUB_OUTPUT"
          echo "Image to scan: ${image}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ steps.meta.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          exit-code: '1'              # fail the job on findings at/above the severity below
          ignore-unfixed: true        # skip CVEs with no fix available
          format: 'table'
          severity: 'HIGH,CRITICAL'
