# Uses Trivy image scanner for Common Vulnerabilities and Exposures (CVEs) in the built Docker image
name: Image Scanner

on:
  workflow_call: # Enables this workflow to be called as a reusable template

jobs:
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # read repository code
    steps:
      # Step 1: Download your source code files
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      # Step 2: Authenticate with Docker Hub (needed to pull the image if the repo is private)
      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Scan the pushed image using Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/mamta-medical:v1.4.1   # matches docker-build-push
          exit-code: '1'              # fail the job on findings at/above the severity below
          format: 'table'
          severity: 'HIGH,CRITICAL'