name: Job Outputs Demo

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    outputs:
      today: ${{ steps.get-date.outputs.today }}   # Expose step output at job level

    steps:
      - name: Get today's date
        id: get-date                                # id is required to reference this step's outputs
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  consume:
    runs-on: ubuntu-latest
    needs: generate                                 # Must declare dependency to access outputs

    steps:
      - name: Print the date from previous job
        run: |
          echo "Date generated by 'generate' job: ${{ needs.generate.outputs.today }}"
