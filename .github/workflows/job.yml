name: Environment Variables Demo

on:
  push:
  workflow_dispatch:

env:
  APP_NAME: myapp          # Workflow-level: accessible in all jobs and steps

jobs:
  print-vars:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: staging   # Job-level: accessible in all steps of this job

    steps:
      - name: Print all environment variables
        env:
          VERSION: 1.0.0     # Step-level: accessible only in this step
        run: |
          echo "=== Environment Variables ==="
          echo "Workflow-level  → APP_NAME:     $APP_NAME"
          echo "Job-level       → ENVIRONMENT:  $ENVIRONMENT"
          echo "Step-level      → VERSION:       $VERSION"

          echo ""
          echo "=== GitHub Context Variables ==="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
