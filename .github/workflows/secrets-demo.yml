name: Secrets Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret is set (safe)
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "The secret is set: true"
          else
            echo "The secret is set: false"
          fi
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}

      - name: Try to print the secret directly (unsafe demo)
        run: echo "Secret value is ${{ secrets.MY_SECRET_MESSAGE }}"
