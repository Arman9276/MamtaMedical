name: "Security scan"

on:
  workflow_dispatch: # Allows you to trigger this scan manually from the Actions tab
  pull_request:
    branches: [ main ] 

jobs:
  Betterleaks:
    name: Betterleaks Secrets Scan
    uses: ./.github/workflows/betterleak-secrets-scan.yml
    permissions:
      contents: read          # read repository code
      security-events: write  # upload alerts to the Security tab
      actions: read           # needed to call the reusable workflow

  Semgrep:
    needs: Betterleaks
    name: Semgrep SAST
    uses: ./.github/workflows/Semgrep-Security.yml
    with:
      fail_on_findings: true  # Fail the job if Semgrep finds any issues
    permissions:
      contents: read          # read repository code
      security-events: write  # upload alerts to the Security tab
      actions: read           # needed to call the reusable workflow

  codeql:
    needs: Semgrep
    name: CodeQL
    uses: ./.github/workflows/CodeQL-Security.yml
    with:
      languages: "javascript"
    permissions:
      contents: read          # read repository code
      security-events: write  # upload alerts to the Security tab
      actions: read           # needed to call the reusable workflow

  docker-lint:
    name: Docker Lint
    uses: ./.github/workflows/docker-lint.yml   # runs in parallel — lints the Dockerfile
    permissions:
      contents: read          # read repository code

  deploy:
    needs: [ Betterleaks, Semgrep, codeql ]
    name: Deploy to GitHub Pages
    uses: ./.github/workflows/page-deploy.yml
    secrets: inherit          # pass repo secrets (FIREBASE_API_KEY) into the reusable workflow
    permissions:
      contents: read          # read repository code
      pages: write            # needed to deploy to GitHub Pages
      id-token: write         # needed to deploy to GitHub Pages

  docker-build-push:
    needs: [ Betterleaks, Semgrep, codeql, docker-lint ]   # only build/push after security passes AND Dockerfile is clean
    name: Build & Push Docker Image
    uses: ./.github/workflows/docker-build-push.yml
    secrets: inherit          # pass DOCKER_PASSWORD into the reusable workflow
    permissions:
      contents: read          # read repository code

  image-scan:
    needs: docker-build-push  # scan the image we just pushed for HIGH/CRITICAL CVEs
    name: Image Scan
    uses: ./.github/workflows/image-scan.yml
    secrets: inherit          # pass DOCKER_PASSWORD so Trivy can pull the image
    permissions:
      contents: read          # read repository code
