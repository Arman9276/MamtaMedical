name: "Security scan"

on:
  workflow_dispatch: # Allows you to trigger this scan manually from the Actions tab
  pull_request:
    branches: [ main ] 

jobs:
  Betterleaks:
    name: Betterleaks Secrets Scan
    uses: ./.github/workflows/betterleak-secrets-scan.yml
    permissions:
      contents: read          # read repository code
      security-events: write  # upload alerts to the Security tab
      actions: read           # needed to call the reusable workflow

  Semgrep:
    needs: Betterleaks
    name: Semgrep SAST
    uses: ./.github/workflows/Semgrep-Security.yml
    with:
      fail_on_findings: true  # Fail the job if Semgrep finds any issues
    permissions:
      contents: read          # read repository code
      security-events: write  # upload alerts to the Security tab
      actions: read           # needed to call the reusable workflow

  codeql:
    needs: Semgrep
    name: CodeQL
    uses: ./.github/workflows/CodeQL-Security.yml
    with:
      languages: "javascript"
    permissions:
      contents: read          # read repository code
      security-events: write  # upload alerts to the Security tab
      actions: read           # needed to call the reusable workflow

  deploy:
    needs: [ Betterleaks, Semgrep, codeql ]
    name: Deploy to GitHub Pages
    uses: ./.github/workflows/page-deploy.yml
    secrets: inherit          # pass repo secrets (FIREBASE_API_KEY) into the reusable workflow
    permissions:
      contents: read          # read repository code
      pages: write            # needed to deploy to GitHub Pages
      id-token: write         # needed to deploy to GitHub Pages
 