name: Smart Pipeline

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run linter
        run: echo "Linting code..."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: echo "Running tests..."

  summary:
    runs-on: ubuntu-latest
    needs: [lint, test]                              # Runs after both lint and test complete

    steps:
      - name: Print branch context
        run: |
          echo "===== Pipeline Summary ====="
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit SHA:   ${{ github.sha }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"
          echo ""

      - name: Main branch summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Branch type: MAIN"
          echo "This push went to main — production-ready pipeline completed."

      - name: Feature branch summary
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Branch type: FEATURE"
          echo "This push was on feature branch: ${{ github.ref_name }}"
          echo "Lint and tests passed — ready to open a pull request."
